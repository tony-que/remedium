# Checks every push and pull request: dependency audit, lint, types, unit
# tests (against a real Postgres), the production build, and the Playwright
# smoke test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: remedium
          POSTGRES_PASSWORD: remedium
          POSTGRES_DB: remedium_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U remedium"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://remedium:remedium@localhost:5432/remedium_dev
      TEST_DATABASE_URL: postgresql://remedium:remedium@localhost:5432/remedium_test
      E2E_DATABASE_URL: postgresql://remedium:remedium@localhost:5432/remedium_e2e
      # Test-only values; no real secret is used or needed in CI.
      AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      TOKEN_ENC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm 11 (pinned in package.json)
        run: npm install -g npm@11.21.3

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Create test databases
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE remedium_test;"
          psql "$DATABASE_URL" -c "CREATE DATABASE remedium_e2e;"

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test
        run: npm run test:e2e
